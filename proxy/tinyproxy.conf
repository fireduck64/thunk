User nobody
Group nogroup
Port 8888
Timeout 600
LogLevel Info
MaxClients 100

# Allow connections from Docker private subnets (the internal jail_net)
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Strict domain allowlist (blocks raw IP connections and non-matching hosts)
Filter "/etc/tinyproxy/allowed_domains.txt"
FilterURLs Off
FilterExtended On
FilterCaseSensitive Off
FilterDefaultDeny Yes

# Only allow HTTPS CONNECT on port 443
ConnectPort 443
