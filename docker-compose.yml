networks:
  default:
    driver: bridge
  jail_net:
    driver: bridge
    internal: true   # No gateway to host LAN or internet; can ONLY talk to workspace-proxy

services:
  workspace-proxy:
    image: alpine:3.20
    container_name: workspace-proxy
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache tinyproxy socat &&
             (socat TCP-LISTEN:22,fork,reuseaddr TCP4:spark.1209k.com:22 &) &&
             exec tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf"
    volumes:
      - ./proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./proxy/allowed_domains.txt:/etc/tinyproxy/allowed_domains.txt:ro
    networks:
      default:
      jail_net:
        aliases:
          - spark-git

  vectordb:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # Optional: if you don't want it backed up, you can ensure it restarts cleanly
    restart: unless-stopped

  thunk-workspace:
    build:
      context: .
      dockerfile: Dockerfile.jail
    container_name: thunk-workspace
    command: ["sleep", "infinity"]
    restart: unless-stopped
    tmpfs:
      - "/tmp:size=512m"
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 128
    networks: 
      - jail_net
    environment:
      # Standard proxy env vars respected by curl, wget, pip, requests, urllib, astropy
      - HTTP_PROXY=http://workspace-proxy:8888
      - HTTPS_PROXY=http://workspace-proxy:8888
      - http_proxy=http://workspace-proxy:8888
      - https_proxy=http://workspace-proxy:8888
      # Persist any runtime `pip install` packages inside the mounted workspace!
      - PYTHONUSERBASE=/home/agent/workspace/.local
      - PIP_USER=1
      - PIP_BREAK_SYSTEM_PACKAGES=1
      - PATH=/home/agent/workspace/.local/bin:/home/agent/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./data/thunk/workspace:/home/agent/workspace:rw
      - ./data/shared/workspace:/home/agent/workspace/shared:rw
      - ./data/thunk/mind_ro:/home/agent/mind:ro
      - ./data/thunk/logs:/home/agent/logs:ro
      - ./data/thunk/metrics:/home/agent/metrics:ro
      - ./data/thunk/ssh:/home/agent/.ssh:rw

  wisp-workspace:
    build:
      context: .
      dockerfile: Dockerfile.jail
    container_name: wisp-workspace
    command: ["sleep", "infinity"]
    restart: unless-stopped
    tmpfs:
      - "/tmp:size=512m"
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 128
    networks: 
      - jail_net
    environment:
      # Standard proxy env vars respected by curl, wget, pip, requests, urllib, astropy
      - HTTP_PROXY=http://workspace-proxy:8888
      - HTTPS_PROXY=http://workspace-proxy:8888
      - http_proxy=http://workspace-proxy:8888
      - https_proxy=http://workspace-proxy:8888
      # Persist any runtime `pip install` packages inside the mounted workspace!
      - PYTHONUSERBASE=/home/agent/workspace/.local
      - PIP_USER=1
      - PIP_BREAK_SYSTEM_PACKAGES=1
      - PATH=/home/agent/workspace/.local/bin:/home/agent/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./data/wisp/workspace:/home/agent/workspace:rw
      - ./data/shared/workspace:/home/agent/workspace/shared:rw
      - ./data/wisp/mind_ro:/home/agent/mind:ro
      - ./data/wisp/logs:/home/agent/logs:ro
      - ./data/wisp/metrics:/home/agent/metrics:ro
      - ./data/wisp/ssh:/home/agent/.ssh:rw

  # We can add Ollama here later if needed, though running it natively on the host 
  # is usually easier for GPU access.

volumes:
  qdrant_data:
    name: thunk_qdrant_data
    external: true

