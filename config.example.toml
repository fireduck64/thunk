[llm]
# The main agent inference model (e.g., Llama 3, Mixtral)
api_url = "https://ollama-api.example.com/v1"
api_key = "YOUR_API_KEY_HERE"
model_name = "llama3" 

[embeddings]
# The fast embedding model for vector DB ingestion/search
api_url = "http://localhost:11434/api/embeddings"
api_key = ""
model_name = "nomic-embed-text"

[discord]
# To get a token, create an application at https://discord.com/developers/applications
# Ensure you enable the "Message Content Intent" in the Bot settings.
bot_token = "YOUR_DISCORD_BOT_TOKEN_HERE"
# Optional: Restrict the bot to only listen/reply in a specific channel ID
# allowed_channel_id = 123456789012345678
