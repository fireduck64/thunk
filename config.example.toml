[agent]
name = "Thunk"                        # Agent identity injected into the system prompt (REQUIRED)

[directives]
file_path = "data/thunk/directives.md"# Path to markdown/text file containing core directives & personality (REQUIRED)

[llm]
# The main agent inference model endpoint (OpenAI-compatible, e.g. Ollama, vLLM, or OpenAI)
api_url = "https://ollama-api.example.com/v1"
api_key = "YOUR_API_KEY_HERE"
model_name = "llama3"
max_output_tokens = 16384             # Hard token ceiling per LLM completion to prevent runaway loops

[subconscious]
# Mode: "standard" (stateless top-k SubconsciousRecallComponent) or "spreading_activation" (stateful Layer-1 Mind Gardener)
mode = "spreading_activation"
# Lightweight model used to filter and synthesize associative memories
api_url = "https://ollama-api.example.com/v1"
api_key = "YOUR_API_KEY_HERE"
model_name = "gemma4:e2b"
top_k = 8
max_output_tokens = 2048
layer_1_pool_size = 32                # Maximum number of memories held in the stateful Layer-1 working pool
layer_0_promotion_count = 8           # Number of candidates promoted from Layer-1 to synthesis on each turn

[critic]
frequency = 8
max_output_tokens = 1024

[tokenizer]
# HuggingFace model path used strictly for token counting in tiered memory
model_name = "unsloth/gemma-7b"

[memory]
# Context window token watermarks and compression limits
high_watermark = 16000                # Trigger memory compression when working memory exceeds this token count
low_watermark = 8000                  # Evict messages until working memory drops below this target
max_summarize_tokens = 6000           # Maximum token chunk size sent to the summarizer in a single step
max_summary_tokens = 8192             # Maximum token length permitted for the persistent core summary
db_path = "data/thunk/memory.db"      # SQLite database file for archival log, core summary, and compaction state (REQUIRED)

[notes]
db_path = "data/thunk/notes.db"       # SQLite database file for structured scratchpad notes (REQUIRED)

[tasks]
db_path = "data/thunk/tasks.db"       # SQLite database file for priority task queue (REQUIRED)

[skills]
skills_dir = "data/thunk/skills"      # Directory storing agent procedural markdown skills (REQUIRED)

[logging]
log_dir = "data/thunk/logs"           # Directory storing session JSONL audit logs (REQUIRED)
verbose = true                        # When true, dumps full agent context on turns

[file_reader]
db_path = "data/thunk/reader_state.db"# SQLite database file for EPUB/PDF bookmark state and metadata cache

[file_reader.libraries]
# Named libraries mapping alias names to local directories for reading books, PDFs, code, and images (REQUIRED)
ebook = "/vault/ebook"
pdf = "/vault/pdf"
discord_file = "data/thunk/images"
thunk_source = "/home/fireduck/projects/thunk/src"

[embeddings]
# Embedding model for vector database ingestion and semantic search
api_url = "http://localhost:11434/api/embeddings"
api_key = ""
model_name = "nomic-embed-text"

[vectordb]
# Qdrant vector database configuration
host = "localhost"
port = 6333
knowledge_collection = "knowledge_base"  # Static external knowledge collection (REQUIRED)
memory_collection = "agent_memory"       # Agent's personal episodic and semantic memory collection (REQUIRED)

[mqtt]
# MQTT broker for system inbox notifications, peer direct messaging, and presence discovery
host = "localhost"
port = 1883
inbox_topic = "thunk/agent/inbox"
dm_topic = "thunk/agent/dm"
presence_topic = "thunk/agent/presence"
outbox_topic = "thunk/agent/outbox"

[discord]
# Discord bot integration
# Create an application at https://discord.com/developers/applications
# Ensure you enable the "Message Content Intent" in the Bot settings.
bot_token = "YOUR_DISCORD_BOT_TOKEN_HERE"
images_dir = "data/thunk/images"      # Directory where incoming Discord image attachments are saved
# Optional: Restrict the bot to only listen and reply in a specific channel ID (integer)
# allowed_channel_id = 123456789012345678

[oracle]
# Cloud AI Oracle (Google Gemini) integration for live current events and external reasoning
gemini_api_key = "YOUR_GEMINI_API_KEY_HERE"
gemini_model = "gemini-3.8-flash"

[workspace]
# Air-gapped Linux container workspace and read-only mind mirror
enabled = false
container_name = "thunk-workspace"
container_user = "agent"
container_workdir = "/home/agent/workspace"
workspace_dir = "data/thunk/workspace"
mind_ro_dir = "data/thunk/mind_ro"
live_db_path = "data/thunk/memory.db"
default_timeout_sec = 30
max_output_chars = 6000

[debug]
# Set to true to print LLM output chunks to the console in real-time as they generate
stream_output = true

# Optional: Multi-Thread Consciousness Configuration
# When omitted, Thunk runs a single "main" thread with all enabled components and adapters.
# Uncomment the sections below to split consciousness into concurrent specialized threads
# that share long-term memory (Qdrant), notes, tasks, and a single combined session JSONL log,
# while maintaining isolated per-thread working memory and Layer-1 spreading activation pools.
#
# [threads.social]
# role = "External communication & social presence (Discord, MQTT, and peer DMs)"
# adapters = ["discord", "mqtt"]
# components = ["notes", "tasks", "vector_memory", "knowledge", "global_search", "file_reader", "oracle", "skills"]
#
# [threads.reader]
# role = "Deep sequential reading, literature study, and synthesis (EPUBs & PDFs)"
# adapters = []
# components = ["file_reader", "notes", "tasks", "vector_memory", "knowledge", "global_search", "skills"]
#
# [threads.worker]
# role = "Autonomous coding, data analysis, and Linux workspace execution"
# adapters = []
# components = ["workspace", "file_reader", "notes", "tasks", "vector_memory", "knowledge", "global_search", "oracle", "skills"]

